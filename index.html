<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style> #map { height: 280px; width: 100%; border-radius: 0.75rem; } </style>
</head>
<body class="bg-slate-900 text-slate-100 p-4 font-sans">

    <div class="max-w-5xl mx-auto space-y-4">
        <!-- Header -->
        <div class="border-b border-slate-700 pb-2 flex justify-between items-center">
            <h1 class="text-lg font-bold text-emerald-400">🌍 GeoAir ML Dashboard (Colab)</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded">● Sistema Listo</span>
        </div>

        <!-- Seccion 1: Mapa y Prediccion -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Mapa -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <h2 class="text-xs font-semibold mb-2 text-slate-300">📍 Estaciones de Monitoreo Espacial</h2>
                <div id="map"></div>
            </div>

            <!-- Formulario ML -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 text-xs flex flex-col justify-between">
                <div>
                    <h2 class="text-xs font-semibold mb-2 text-cyan-400">⚡ Predicción de CO (Machine Learning)</h2>
                    <div class="space-y-2">
                        <div>
                            <label>NO₂ (µg/m³):</label>
                            <input type="number" id="no2" value="45.5" class="w-full bg-slate-900 border border-slate-700 p-1 rounded">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label>Temperatura (°C):</label>
                                <input type="number" id="temp" value="28.4" class="w-full bg-slate-900 border border-slate-700 p-1 rounded">
                            </div>
                            <div>
                                <label>Humedad (%):</label>
                                <input type="number" id="hum" value="65.0" class="w-full bg-slate-900 border border-slate-700 p-1 rounded">
                            </div>
                        </div>
                        <button onclick="calcularPrediccion()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-1.5 rounded font-bold text-white mt-1">
                            Calcular Monóxido de Carbono
                        </button>
                    </div>
                </div>
                <div id="resBox" class="mt-2 p-2 bg-slate-900 rounded border border-emerald-500 hidden">
                    <span class="text-slate-400">Resultado ML:</span>
                    <b id="resVal" class="text-emerald-400 text-sm block"></b>
                </div>
            </div>
        </div>

        <!-- Seccion 2: Graficos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <h3 class="text-xs font-semibold text-amber-400 mb-1">📊 CO Promedio por Estación</h3>
                <div id="graficoBarras" style="height: 200px;"></div>
            </div>
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <h3 class="text-xs font-semibold text-purple-400 mb-1">📈 Temperatura vs CO</h3>
                <div id="graficoDispersion" style="height: 200px;"></div>
            </div>
        </div>
    </div>

    <script>
        // Inicializar Mapa Espacial
        const map = L.map('map').setView([-1.0000, -80.4500], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const estaciones = [
            { nombre: 'Portoviejo Centro', lat: -1.0545, lng: -80.4544, co: 5.8 },
            { nombre: 'Manta Puerto', lat: -0.9490, lng: -80.7300, co: 8.2 },
            { nombre: 'Chone Norte', lat: -0.6980, lng: -80.0935, co: 4.1 },
            { nombre: 'Jipijapa Sur', lat: -1.3489, lng: -80.5786, co: 6.4 }
        ];

        estaciones.forEach(e => {
            L.marker([e.lat, e.lng]).addTo(map).bindPopup(`<b>${e.nombre}</b><br>CO: ${e.co} mg/m³`);
        });

        // Grafico 1: Barras
        Plotly.newPlot('graficoBarras', [{
            x: estaciones.map(e => e.nombre),
            y: estaciones.map(e => e.co),
            type: 'bar',
            marker: { color: ['#10b981', '#f59e0b', '#3b82f6', '#8b5cf6'] }
        }], {
            paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
            font: { color: '#94a3b8', size: 9 },
            margin: { t: 10, b: 30, l: 30, r: 10 }
        });

        // Grafico 2: Dispersion
        Plotly.newPlot('graficoDispersion', [{
            x: [20, 22, 25, 27, 29, 31, 33, 35],
            y: [3.2, 4.1, 5.0, 5.8, 6.7, 7.5, 8.1, 9.0],
            mode: 'markers+lines', type: 'scatter',
            marker: { color: '#a855f7', size: 6 }
        }], {
            paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
            font: { color: '#94a3b8', size: 9 },
            margin: { t: 10, b: 30, l: 30, r: 10 }
        });

        // Funcion de Prediccion
        function calcularPrediccion() {
            const temp = parseFloat(document.getElementById('temp').value);
            const no2 = parseFloat(document.getElementById('no2').value);
            const hum = parseFloat(document.getElementById('hum').value);
            const val = ((temp * 0.08) + (no2 * 0.05) + (hum * 0.02)).toFixed(2);
            
            document.getElementById('resVal').innerText = val + " mg/m³";
            document.getElementById('resBox').classList.remove('hidden');
        }
    </script>
</body>
</html>
